# Source runtime tested: Python 3.13.5 (Anaconda).
# Python is not pinned here so Conda can select a version supported by the
# compiled packages on the installation platform.
name: edge-nonlinear-hall
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python
  - numpy=2.1.3
  - scipy=1.15.3
  - matplotlib=3.10.0
  - kwant=1.5.0
  - tinyarray=1.2.5
  - threadpoolctl=3.5.0
